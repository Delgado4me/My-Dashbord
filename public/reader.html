<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://*.supabase.co; img-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Obsidian · Мій день</title>
  <link rel="stylesheet" href="/reader.css">
</head>
<body>
  <div class="reader">
    <header>
      <a class="back" href="/#view/obsidian">← Дашборд</a>
      <span class="brand">◆ Obsidian</span>
      <button id="reload" type="button" aria-label="Оновити файл">↻</button>
    </header>
    <main>
      <p id="status" role="status">Перевіряємо вхід…</p>
      <section id="note" hidden>
        <p class="eyebrow">ПРИВАТНИЙ ФАЙЛ · GITHUB</p>
        <h1 id="title"></h1>
        <p id="folder" class="folder"></p>
        <div id="choices" class="choices" hidden></div>
        <article id="content" class="markdown"></article>
        <a id="original" target="_blank" rel="noopener noreferrer">Відкрити оригінал у GitHub ↗</a>
      </section>
      <a id="login" href="/#view/obsidian" hidden>Увійти з головного екрана →</a>
    </main>
  </div>
  <script src="/config.js" defer></script>
  <script src="/backend.js" defer></script>
  <script src="/vendor/marked-17.0.5.umd.js" defer></script>
  <script src="/reader.js" defer></script>
</body>
</html>
